# Publishes the MimeMagic package to nuget.org when a v* tag is pushed
# (e.g. v4.0.0 publishes version 4.0.0), then creates a GitHub release for the
# tag with notes generated from the pull requests merged since the previous tag.
# The package's release notes link to that GitHub release.
#
# Authentication uses nuget.org Trusted Publishing: NuGet/login exchanges the
# GitHub OIDC token for a short-lived API key, so no long-lived key is stored.
# Requires a Trusted Publishing policy on nuget.org for this repository and
# workflow file, and a NUGET_USER repository secret holding the nuget.org
# account name.
name: Pack

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pack:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write
    steps:
      # Full history: MinVer needs the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # global.json selects the SDK; the 8.0 runtime is still needed to run the net8.0 tests.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Mime.slnx

      # MinVer versions the build from the tag; pack reuses it.
      - name: Build
        run: dotnet build Mime.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test test/MimeTests/MimeTests.csproj --no-build -c Release

      - name: Pack
        run: dotnet pack src/Mime/Mime.csproj --no-build -c Release -o nupkg -p:PackageReleaseNotes=https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}

      # MinVer falls back to 0.0.0-alpha.0 without failing when it finds no tag.
      - name: Check package version matches tag
        run: |
          expected="nupkg/MimeMagic.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "::error::Expected $expected, found: $(ls nupkg)"
            exit 1
          fi

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          retention-days: 90

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg nupkg/*.snupkg --verify-tag --generate-notes --title "MimeMagic ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
