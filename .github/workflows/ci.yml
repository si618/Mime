name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
            platform: ARM64

    env:
      PLATFORM_ARG: ${{ matrix.platform && format('-p:Platform={0}', matrix.platform) || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # global.json selects the SDK; the 8.0 runtime is still needed to run the net8.0 tests.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Mime.slnx

      - name: Build
        run: dotnet build Mime.slnx --no-restore -c Release -warnaserror ${{ env.PLATFORM_ARG }}

      - name: Test
        run: dotnet test test/MimeTests/MimeTests.csproj --no-build -c Release ${{ env.PLATFORM_ARG }} --output Detailed --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
