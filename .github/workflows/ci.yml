name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
            platform: ARM64
          - os: macos-13

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Mime.slnx -c Release

      - name: Test
        run: dotnet test test/MimeTests/MimeTests.csproj -c Release --logger "console;verbosity=normal" ${{ matrix.platform && format('-p:Platform={0}', matrix.platform) || '--no-build' }}
