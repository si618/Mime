name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-linux-deps:
    name: Check Linux native dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check shared libraries and glibc symbol versions
        run: |
          for rid in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64; do
            .github/scripts/check-linux-deps.sh "$rid" "src/Mime/runtimes/$rid/native/libmagic-1.so"
          done

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
            platform: ARM64

    env:
      PLATFORM_ARG: ${{ matrix.platform && format('-p:Platform={0}', matrix.platform) || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # global.json selects the SDK; the 8.0 runtime is still needed to run the net8.0 tests.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Mime.slnx

      - name: Build
        run: dotnet build Mime.slnx --no-restore -c Release -warnaserror ${{ env.PLATFORM_ARG }}

      - name: Test
        run: dotnet test test/MimeTests/MimeTests.csproj --no-build -c Release ${{ env.PLATFORM_ARG }} --output Detailed --report-xunit-trx --coverage --coverage-output-format cobertura --results-directory artifacts/test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.cobertura.xml
